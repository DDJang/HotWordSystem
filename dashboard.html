<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>热词监控与控制中心</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f3f4f6;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg);
            display: flex;
            gap: 20px;
            padding: 20px;
            height: 95vh;
            box-sizing: border-box;
        }

        .left-col {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .right-col {
            flex: 1;
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .chart-box {
            flex: 1;
            min-height: 300px;
        }

        h2 {
            margin-top: 0;
            color: #1f2937;
            margin-bottom: 10px;
            font-size: 20px;
        }

        h3 {
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            margin: 0 0 10px 0;
            color: #4b5563;
            font-weight: 700;
        }

        .control-group {
            border: 1px solid #f3f4f6;
            padding: 10px;
            border-radius: 8px;
            background: #fafafa;
        }

        input,
        button,
        textarea {
            width: 100%;
            padding: 6px 10px;
            margin-bottom: 8px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 13px;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
            padding: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: #6b7280;
        }

        button.danger {
            background: #dc2626;
        }

        button.success {
            background: #059669;
        }

        .dual-input {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 8px;
        }

        .dual-input label {
            font-size: 12px;
            color: #666;
            width: 55px;
            flex-shrink: 0;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 5px;
        }

        .tag-check {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th,
        td {
            text-align: left;
            padding: 6px;
            border-bottom: 1px solid #eee;
        }

        th {
            color: #666;
            font-weight: normal;
        }

        .trend-up {
            color: #dc2626;
            font-weight: bold;
        }

        .trend-down {
            color: #059669;
            font-weight: bold;
        }

        .badge {
            background: #fee2e2;
            color: #b91c1c;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        #windowInfo {
            font-size: 14px;
            color: #666;
            font-family: monospace;
        }

        #log {
            font-family: 'Consolas', monospace;
            font-size: 12px;
            color: #10b981;
            background: #1f2937;
            padding: 10px;
            border-radius: 6px;
            min-height: 40px;
            max-height: 80px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 0;
        }

        /* 弹窗样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            animation: popIn 0.3s ease;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #eee;
            font-size: 14px;
        }

        .stat-val {
            font-weight: bold;
            color: var(--primary);
            font-family: monospace;
        }

        @keyframes popIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="left-col">
        <div class="card chart-box">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2>🔥 实时热词榜</h2>
                <div id="windowInfo">Window: [Wait...]</div>
            </div>
            <div id="mainChart" style="width:100%; height:90%;"></div>
        </div>

        <div class="card" style="flex: 1;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 10px;">
                <h2 style="margin:0;">📈 趋势分析</h2>
                <div style="display:flex; align-items:center; gap:5px;">
                    <span style="font-size:12px; color:#666;">阈值:</span>
                    <input type="number" id="trendThreshold" value="2" style="width:60px; margin:0;">
                </div>
            </div>
            <div style="overflow-y: auto; height: 80%;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>热词</th>
                            <th>趋势分</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="trendBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="right-col">
        <h2 style="margin-bottom: 0;">🎮 控制台</h2>

        <div>
            <div id="log">System Ready...</div>
        </div>

        <!-- 时间窗口 -->
        <div class="control-group">
            <h3>⏳ 视图设置</h3>
            <div class="dual-input">
                <label>Window:</label>
                <!-- 限制 1秒 ~ 86400秒(1天) -->
                <input type="number" id="winSize" value="600" min="1" max="86400" placeholder="1-86400">
                <button onclick="updateWindowSize()" style="width: 50px;">Set</button>
            </div>
            <div class="dual-input">
                <label>Storage:</label>
                <!-- 限制 600秒 ~ 604800秒(7天) -->
                <input type="number" id="retSize" value="3600" min="600" max="604800" placeholder="> Window">
                <button onclick="updateRetention()" style="width: 50px;">Set</button>
            </div>
            <div class="dual-input">
                <label>Top-K:</label>
                <!-- 限制 1 ~ 100 -->
                <input type="number" id="displayK" value="10" min="1" max="100">
            </div>
            <div style="font-size:11px; color:#999; text-align:right;" id="retentionInfo">Retention: -- s</div>
        </div>

        <!-- 数据模拟 -->
        <div class="control-group">
            <h3>📝 数据模拟</h3>
            <div class="row">
                <textarea id="manualInput" rows="1" placeholder="输入内容..."></textarea>
                <button onclick="sendManualData()" style="width: 60px;">发送</button>
            </div>
        </div>

        <!-- 过滤配置 -->
        <div class="control-group">
            <h3>⚙️ 过滤配置</h3>
            <div class="tag-group">
                <!-- 【新增】允许所有 -->
                <label class="tag-check" style="font-weight:bold; color:#2563eb;">
                    <input type="checkbox" id="cb_all" onchange="toggleAll(this)"> 不过滤词性
                </label>

                <!-- 分割线 -->
                <span style="border-left:1px solid #ccc; margin:0 5px;"></span>

                <!-- 常规词性 -->
                <label class="tag-check"><input type="checkbox" class="pos-item" value="n" checked
                        onchange="updateConfig()"> 名(n)</label>
                <label class="tag-check"><input type="checkbox" class="pos-item" value="v" checked
                        onchange="updateConfig()"> 动(v)</label>
                <label class="tag-check"><input type="checkbox" class="pos-item" value="a" onchange="updateConfig()">
                    形(a)</label>
                <label class="tag-check"><input type="checkbox" class="pos-item" value="nr" onchange="updateConfig()">
                    人</label>
                <label class="tag-check"><input type="checkbox" class="pos-item" value="eng" checked
                        onchange="updateConfig()"> Eng</label>
            </div>

            <!-- 敏感词部分保持不变 -->
            <div class="row" style="margin-top:8px;">
                <input type="text" id="newSensitive" placeholder="屏蔽词..." style="margin-bottom:0;">
                <button onclick="addSensitive()" style="width:40px;">+</button>
            </div>
            <div id="sensitiveList" class="tag-group" style="margin-top:5px;"></div>
        </div>

        <!-- 统计与报告 (补全的功能) -->
        <div class="control-group">
            <h3>📊 统计与报告</h3>
            <div class="row">
                <button onclick="showStats()" class="success">查看性能指标</button>
                <button onclick="genReport()" class="secondary">导出历史报告</button>
            </div>
        </div>

        <!-- 历史回放 -->
        <div class="control-group">
            <h3>📂 历史回放</h3>
            <div class="row">
                <!-- 增加 pattern 提示格式 -->
                <input type="text" id="histStart" value="00:00:00" placeholder="HH:MM:SS" maxlength="8">
                <input type="text" id="histEnd" value="00:10:00" placeholder="HH:MM:SS" maxlength="8">
            </div>
            <div class="row">
                <button onclick="viewHistory()" style="background: #8b5cf6;">回放图表</button>
                <button onclick="backToRealtime()">返回实时</button>
            </div>
        </div>

        <!-- 系统操作 -->
        <div class="control-group" style="border-color:#fca5a5; background:#fef2f2;">
            <h3 style="color:#b91c1c;">⚡ 系统操作</h3>
            <div class="row">
                <!-- 限制 N 最大 100,000，防止压测卡死 -->
                <input type="number" id="benchN" value="1000" min="1" max="100000" placeholder="Max 100000">
                <button onclick="runBench()" class="danger">启动压力测试</button>
            </div>
            <button onclick="resetSystem()" class="danger" style="margin-top:5px;">清空所有数据</button>

            <!-- 【新增】终止按钮 -->
            <button onclick="shutdownSystem()" class="danger" style="margin-top:5px; background:#7f1d1d;">
                终止程序</button>
        </div>
    </div>

    <!-- 性能统计弹窗 -->
    <div id="statsModal" class="modal-overlay" onclick="closeStats(event)">
        <div class="modal-content">
            <h2 style="border-bottom:none; margin-bottom:10px;">🚀 系统性能</h2>
            <div class="stat-row"><span>运行时间</span><span class="stat-val" id="st_time">0s</span></div>
            <div class="stat-row"><span>处理行数</span><span class="stat-val" id="st_lines">0</span></div>
            <div class="stat-row"><span>处理词数</span><span class="stat-val" id="st_words">0</span></div>
            <div class="stat-row"><span>吞吐量 (QPS)</span><span class="stat-val" id="st_qps">0</span></div>
            <div class="stat-row"><span>内存占用</span><span class="stat-val" style="color:#dc2626;" id="st_mem">0 MB</span>
            </div>
            <div style="text-align:right; margin-top:15px;">
                <button onclick="closeStats(null)" class="secondary" style="width:auto;">关闭</button>
            </div>
        </div>
    </div>

    <script>
        var myChart = echarts.init(document.getElementById('mainChart'));
        myChart.setOption({
            tooltip: { trigger: 'axis' },
            grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true, top: '10%' },
            xAxis: { type: 'category', data: [] },
            yAxis: { type: 'value' },
            series: [{ type: 'bar', data: [], itemStyle: { color: '#3b82f6', borderRadius: [4, 4, 0, 0] }, label: { show: true, position: 'top' } }]
        });

        var isHistoryMode = false;

        // --- 核心循环 ---
        setInterval(() => {
            if (isHistoryMode) return;

            // 1. 获取用户设置的 K 值
            let k = document.getElementById('displayK').value || 10;

            // 2. 拼接到请求 URL 中
            fetch('/api/data?k=' + k)
                .then(res => res.json())
                .then(data => {
                    myChart.setOption({
                        xAxis: { data: data.categories },
                        series: [{
                            data: data.values,
                            itemStyle: { color: '#3b82f6' }
                        }]
                    });
                    document.getElementById('windowInfo').innerText =
                        `Window: [${data.window_start} ~ ${data.window_end}] | Now: ${data.current_ts}`;
                    document.getElementById('retentionInfo').innerText = `Retention: ${data.retention_sec} s`;
                });

            // 趋势接口也可以加上 k，或者保持默认 10
            fetch('/api/trends?k=10').then(r => r.json()).then(list => renderTrends(list));
        }, 1000);

        // --- 通用校验函数 ---
        function validateNumber(id, min, max, name) {
            const el = document.getElementById(id);
            const val = parseInt(el.value);
            if (isNaN(val)) {
                alert(`❌ [${name}] 请输入有效的数字`);
                return null;
            }
            if (val < min || val > max) {
                alert(`❌ [${name}] 数值必须在 ${min} ~ ${max} 之间`);
                return null;
            }
            return val;
        }

        function validateTime(id) {
            const el = document.getElementById(id);
            const val = el.value.trim();
            // 修改为：允许1到2位数字，逻辑更宽松
            const regex = /^\d{1,2}:\d{1,2}:\d{1,2}$/;
            if (!regex.test(val)) {
                alert(`❌ 时间格式错误: ${val}\n请使用 HH:MM:SS (例如 12:30:00)`);
                return null;
            }
            return val;
        }

        // 【新增】处理 "全选" 逻辑
        function toggleAll(el) {
            const isAll = el.checked;
            const items = document.querySelectorAll('.pos-item');

            // 视觉上禁用/启用其他复选框
            items.forEach(cb => {
                cb.disabled = isAll;
                // 可选：如果全选了，让其他项看起来变灰
                cb.parentElement.style.opacity = isAll ? "0.5" : "1";
            });

            // 立即触发更新
            updateConfig();
        }

        function renderTrends(list) {
            const tbody = document.getElementById('trendBody');
            const threshold = parseFloat(document.getElementById('trendThreshold').value) || 0;
            tbody.innerHTML = "";
            let rank = 1;
            list.forEach(item => {
                if (Math.abs(item.score) < threshold) return;
                const tr = document.createElement('tr');
                const trendClass = item.score > 0 ? "trend-up" : "trend-down";
                tr.innerHTML = `<td>${rank++}</td><td style="font-weight:bold;">${item.word}</td><td class="${trendClass}">${item.score.toFixed(2)}</td><td class="${trendClass}">${item.score > 0 ? "🔥" : "❄️"}</td>`;
                tbody.appendChild(tr);
            });
        }

        // API 基础函数
        function apiPost(url, data) {
            log("Sending...");
            fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
                .then(r => r.json()).then(d => log("✅ " + (d.message || "OK"))).catch(e => log("❌ " + e));
        }
        function log(msg) {
            const el = document.getElementById('log');
            el.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        }

        // 按钮功能函数
        function updateWindowSize() {
            const s = validateNumber('winSize', 1, 86400, "Window Size");
            if (s !== null) apiPost('/api/command', { cmd: `[ACTION] SET_WINDOW S=${s}` });
        }

        function updateRetention() {
            // 获取当前的 window 大小，确保存储时间 >= 窗口时间
            const winSize = parseInt(document.getElementById('winSize').value) || 0;
            const r = validateNumber('retSize', winSize, 2592000, "Retention"); // 上限设为30天
            if (r !== null) apiPost('/api/command', { cmd: `[ACTION] SET_RETENTION R=${r}` });
        }
        function sendManualData() {
            const val = document.getElementById('manualInput').value;
            if (val) { apiPost('/api/command', { cmd: val }); document.getElementById('manualInput').value = ""; }
        }

        // 【修改】实时更新配置 (无需按钮)
        function updateConfig() {
            const allowAll = document.getElementById('cb_all').checked;

            // 收集被勾选的常规 tags
            const checks = document.querySelectorAll('.pos-item:checked');
            const tags = Array.from(checks).map(c => c.value);

            // 发送完整状态
            apiPost('/api/config', {
                allow_all: allowAll,
                tags: tags
            });
        }

        // 敏感词相关
        // 【修改】加载初始配置 (Sync UI)
        // 页面加载时调用一次 fetch，把后端的状态同步到前端 Checkbox
        function loadConfigState() {
            fetch('/api/config').then(r => r.json()).then(d => {
                // 1. 恢复敏感词
                const div = document.getElementById('sensitiveList'); div.innerHTML = "";
                d.sensitive_words.forEach(w => {
                    const s = document.createElement('span'); s.className = "badge"; s.innerHTML = `${w} ×`;
                    s.onclick = () => removeSensitive(w); div.appendChild(s);
                });

                // 2. 【新增】恢复 allow_all 状态
                const cbAll = document.getElementById('cb_all');
                cbAll.checked = d.allow_all;

                // 3. 触发一次 toggleAll 来设置 UI 的禁用状态 (但不发送请求，避免死循环)
                const items = document.querySelectorAll('.pos-item');
                items.forEach(cb => {
                    cb.disabled = d.allow_all;
                    cb.parentElement.style.opacity = d.allow_all ? "0.5" : "1";
                });
                // 注意：这里不需要设置具体的 tags checkbox，因为我们没有回传 tags list
                // 如果你需要完全同步，后端 GET /api/config 也需要回传 current_tags
                // 但通常 checkbox 状态保留在浏览器当前会话就够了，或者你可以让 GET 接口完善一点。
            });
        }
        // 初始化时调用 (替换原来的 loadSensitive)
        loadConfigState();
        // ... addSensitive/removeSensitive 修改为调用 loadConfigState 或局部刷新 ...
        function addSensitive() {
            const w = document.getElementById('newSensitive').value;
            if (w) {
                apiPost('/api/config', { add_sensitive: w });
                document.getElementById('newSensitive').value = "";
                setTimeout(loadConfigState, 500); // 刷新列表
            }
        }
        function removeSensitive(w) {
            if (confirm("Remove " + w + "?")) {
                apiPost('/api/config', { remove_sensitive: w });
                setTimeout(loadConfigState, 500); // 刷新列表
            }
        }

        // 历史相关
        function viewHistory() {
            const s = validateTime('histStart');
            const e = validateTime('histEnd');
            if (!s || !e) return;

            isHistoryMode = true;
            log(`Loading History...`);
            document.getElementById('windowInfo').innerText = `MODE: HISTORY [${s} ~ ${e}]`;

            // 这里也要做简单的 URL 编码防止奇怪字符
            fetch(`/api/history_view?start=${encodeURIComponent(s)}&end=${encodeURIComponent(e)}`)
                .then(r => r.json())
                .then(d => {
                    myChart.setOption({ xAxis: { data: d.categories }, series: [{ data: d.values, itemStyle: { color: '#8b5cf6' } }] });
                });
        }
        function backToRealtime() {
            isHistoryMode = false;
            myChart.setOption({ series: [{ itemStyle: { color: '#3b82f6' } }] });
            log("Back to Realtime.");
        }

        // 统计与报告 (新功能)
        function showStats() {
            fetch('/api/stats').then(r => r.json()).then(d => {
                document.getElementById('st_time').innerText = d.runtime.toFixed(2) + " s";
                document.getElementById('st_lines').innerText = d.lines;
                document.getElementById('st_words').innerText = d.words;
                document.getElementById('st_qps').innerText = d.qps.toFixed(2);
                document.getElementById('st_mem').innerText = d.memory.toFixed(2) + " MB";
                document.getElementById('statsModal').style.display = 'flex';
            });
        }
        function closeStats(e) {
            if (!e || e.target.id === 'statsModal') document.getElementById('statsModal').style.display = 'none';
        }

        function genReport() {
            const s = validateTime('histStart');
            const e = validateTime('histEnd');
            if (s && e) {
                apiPost('/api/command', { cmd: `[ACTION] HISTORY START=${s} END=${e} STEP=60` });
            }
        }

        // 系统操作
        function runBench() {
            const n = validateNumber('benchN', 1, 100000, "Benchmark N");
            if (n !== null) apiPost('/api/command', { cmd: `[ACTION] BENCHMARK N=${n}` });
        }

        function resetSystem() {
            if (!confirm("⚠️ 警告：这将清空所有内存数据和历史日志文件，并会中断压力测试！")) return;

            // 1. 发送命令清空后端 (内存 + 文件)
            apiPost('/api/command', { cmd: `[ACTION] RESET` });

            // 2. 立即清空前端状态
            isHistoryMode = false;
            myChart.setOption({ xAxis: { data: [] }, series: [{ data: [], itemStyle: { color: '#3b82f6' } }] });
            document.getElementById('trendBody').innerHTML = "";
            document.getElementById('windowInfo').innerText = "Window: [Reset] | Now: 00:00:00";
            log("System & Log Cleared.");
        }

        function shutdownSystem() {
            if (!confirm("⚠️ 严重警告 ⚠️\n\n这将完全关闭服务器程序！\n所有连接将断开，您必须手动去服务器重启程序。\n\n确定要关闭吗？")) {
                return;
            }

            apiPost('/api/command', { cmd: `[ACTION] SHUTDOWN` });

            // 禁用界面，提示已断开
            setTimeout(() => {
                document.body.innerHTML = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;flex-direction:column;color:#555;'><h1>🚫 系统已关闭</h1><p>连接已断开，请手动重启服务。</p></div>";
            }, 1000);
        }


    </script>
